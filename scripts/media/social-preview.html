<!doctype html>
<!-- Social cards, sized by the window. 1280x640: GitHub social preview (Settings → Social preview),
     content kept inside the 80px safe border. 1200x630: the landing page's og:image (1.91:1).
     Render both: scripts/media/social-preview.sh → .github/social-preview.png, site/og-image.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hopper social preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6fa; --text: #1a1822; --muted: #676478; --border: #e2e0ea;
  --accent: #6d3fe0; --accent-2: #b04fd8;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
body {
  font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; position: relative;
}
body::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(520px 420px at 25% 50%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
    radial-gradient(600px 360px at 85% 100%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%);
}
.card {
  position: absolute; inset: 80px; display: flex; align-items: center; gap: 56px;
}
@media (max-width: 1200px) { .card { inset: 60px 64px; gap: 48px; } }
.icon { width: 340px; height: 340px; flex: none; filter: drop-shadow(0 18px 30px rgba(60, 20, 140, .18)); }
.copy { min-width: 0; }
.name {
  font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--muted);
  margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
}
.name .pill {
  font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--accent);
  background: #eee6ff; padding: 5px 12px; border-radius: 999px;
}
h1 {
  margin: 0 0 20px; font-size: 66px; line-height: 1.02; letter-spacing: -.045em; font-weight: 800;
}
h1 em {
  font-style: normal;
  background: linear-gradient(95deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
p { margin: 0 0 30px; font-size: 23px; line-height: 1.4; color: var(--muted); max-width: 30ch; }
.apps { display: flex; gap: 10px; }
.apps img {
  width: 44px; height: 44px; border-radius: 11px;
  filter: drop-shadow(0 2px 4px rgba(20, 10, 50, .12));
}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="../../extension/assets/extension-icon.png" alt="">
  <div class="copy">
    <div class="name">Hopper <span class="pill">Raycast extension</span></div>
    <h1>Hop to any<br><em>app, tab, or agent.</em></h1>
    <p>Back and Forward for Mac apps, one search across every tab, and a jump to the agent that needs you.</p>
    <div class="apps">
      <img src="../../site/icons/chrome.png" alt="">
      <img src="../../site/icons/safari.png" alt="">
      <img src="../../site/icons/ghostty.png" alt="">
      <img src="../../site/icons/iterm.png" alt="">
      <img src="../../site/icons/claude.png" alt="">
      <img src="../../site/icons/cursor.png" alt="">
      <img src="../../site/icons/codex.png" alt="">
      <img src="../../site/icons/notion.png" alt="">
      <img src="../../site/icons/obsidian.png" alt="">
    </div>
  </div>
</div>
</body>
</html>
