# Deploys the landing page in site/ to GitHub Pages.
# Images are copied from extension/ at build time so the repo keeps one copy of each.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, extension/assets/extension-icon.png, extension/media/demo.gif, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp site/* _site/
          cp extension/assets/extension-icon.png extension/media/demo.gif _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
