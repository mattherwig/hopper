# Deploys the landing page in site/ to GitHub Pages.
# site/'s images (demo GIF, icon, Store screenshots) are symlinks into extension/; cp -L copies the real files.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, extension/assets/extension-icon.png, extension/media/demo.gif, extension/metadata/jumper-1.png, extension/metadata/jumper-5.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -L site/* _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
